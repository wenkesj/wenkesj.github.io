<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #0D0F11;
    color: #e7e5e4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.65;
    margin: 0;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 80px; }
  header.site {
    border-bottom: 1px solid #292524;
    padding: 12px 16px;
    display: flex; gap: 12px; align-items: center;
    position: sticky; top: 0;
    background: rgba(13, 15, 17, 0.95);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  header.site a { color: #a8a29e; text-decoration: none; font-size: 14px; }
  header.site a:hover { color: #e7e5e4; }
  header.site .title { color: #fcd34d; font-weight: 700; }
  h1 { color: #fcd34d; font-size: 30px; margin: 32px 0 12px; line-height: 1.2; }
  h2 { color: #fbbf24; font-size: 22px; margin: 36px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #292524; }
  h3 { color: #fcd34d; font-size: 18px; margin: 24px 0 8px; }
  h4 { color: #e7e5e4; font-size: 16px; margin: 20px 0 8px; }
  p  { margin: 14px 0; font-size: 15px; }
  ul, ol { margin: 12px 0; padding-left: 24px; }
  li { margin: 6px 0; }
  strong { color: #fafaf9; }
  em     { color: #d6d3d1; font-style: italic; }
  a { color: #fcd34d; text-decoration: underline; text-underline-offset: 2px; }
  a:hover { color: #fde68a; }
  hr { border: 0; border-top: 1px solid #292524; margin: 32px 0; }
  blockquote {
    border-left: 4px solid #b45309;
    background: rgba(28, 25, 23, 0.4);
    margin: 16px 0; padding: 4px 16px;
    color: #d6d3d1; font-style: italic;
  }
  code {
    background: #292524; color: #fcd34d;
    padding: 2px 6px; border-radius: 4px;
    font-size: 13px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  pre {
    background: #1c1917; border: 1px solid #292524;
    border-radius: 8px; padding: 16px; margin: 16px 0;
    overflow-x: auto; font-size: 13px;
  }
  pre code { background: transparent; padding: 0; color: #e7e5e4; }
  img { max-width: 100%; border-radius: 8px; margin: 24px 0; border: 1px solid #292524; }
  table { border-collapse: collapse; margin: 16px 0; border: 1px solid #292524; border-radius: 4px; }
  th { background: #1c1917; color: #fcd34d; text-align: left; padding: 8px 12px; border-bottom: 1px solid #292524; }
  td { padding: 8px 12px; border-bottom: 1px solid #292524; }
  .post-meta { color: #78716c; font-size: 12px; margin-bottom: 24px; }
  .post-list a { display: block; padding: 16px; background: rgba(28, 25, 23, 0.4); border: 1px solid #292524; border-radius: 8px; margin: 8px 0; text-decoration: none; }
  .post-list a:hover { border-color: #b45309; }
  .post-list .title { color: #fcd34d; font-weight: 600; font-size: 18px; }
  .post-list .meta  { color: #78716c; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<header class="site">
  <a href="{{ '/' | relative_url }}" class="title">{{ site.title }}</a>
</header>
<div class="wrap">
  {{ content }}
</div>
{% if page.math or layout.math or site.math %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
</body>
</html>
